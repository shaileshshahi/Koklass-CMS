<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Config list — Koklass-CMS Ember</title>
  <link rel="stylesheet" href="./ember-variables.css" />
  <link rel="stylesheet" href="./admin-demo.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" data-sidebar-active="configs-list"></aside>

    <div class="main">
      <header class="topbar">
        <div>
          <div class="page-title">Sample list</div>
          <div class="crumb">Home / Theme ▸ Samples ▸ List <span class="badge badge-warning" style="margin-left:6px">Dummy data</span></div>
        </div>
        <div class="topbar-search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="search" placeholder="Search…" />
        </div>
        <div class="topbar-user">
          <div class="avatar">TW</div>
          <div class="who"><b>Tsering W.</b><span>Super admin</span></div>
        </div>
        <button class="icon-btn" data-mode-toggle data-mode-icon aria-label="Toggle dark mode">🌙</button>
      </header>

      <main class="content">
        <!-- Demo notice -->
        <section style="display:flex;align-items:center;gap:10px;background:var(--warning);color:var(--warning-foreground);border-radius:12px;padding:10px 16px;font-size:.8rem;font-weight:700;flex-wrap:wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
          Theme sample — all content here is dummy. Copy the markup as a starting point for your real list page.
        </section>

        <!-- Filters -->
        <section class="toolbar">
          <button class="btn btn-primary" onclick="window.location.href='./config-create.html'">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            New config
          </button>
          <div class="spacer"></div>
          <div class="field-sm">
            <svg class="lead" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input id="fq" type="search" placeholder="Filter by key or label…" oninput="page.go()" style="width: 220px;" />
          </div>
          <div class="field-sm">
            <div class="dd" id="f-type" data-dd data-placeholder="All types"></div>
          </div>
          <div class="field-sm">
            <div class="dd" id="f-status" data-dd data-placeholder="All status"></div>
          </div>
        </section>

        <!-- Bulk bar -->
        <section class="bulkbar" id="bulkbar">
          <span class="count" id="bulk-count">0</span> selected
          <button class="btn btn-sm btn-outline" onclick="page.bulkEnable()">Enable</button>
          <button class="btn btn-sm btn-outline" onclick="page.bulkDisable()">Disable</button>
          <button class="btn btn-sm btn-danger" onclick="page.bulkDelete()">Delete</button>
          <div class="spacer" style="flex:1"></div>
          <button class="btn btn-sm btn-ghost" onclick="page.clearSel()">Clear</button>
        </section>

        <!-- Table -->
        <section class="card">
          <div class="card-head">
            <h3>Configurations</h3>
            <span class="hint" id="meta"></span>
          </div>
          <div style="overflow-x: auto">
            <table class="table">
              <thead>
                <tr>
                  <th style="width: 36px"><input type="checkbox" class="cb" id="sel-all" onchange="page.toggleAll(this.checked)" /></th>
                  <th class="sortable" data-sort="key">Key <span class="sort-ind">↕</span></th>
                  <th>Type</th>
                  <th class="sortable" data-sort="value">Value <span class="sort-ind">↕</span></th>
                  <th>Description</th>
                  <th class="sortable" data-sort="updated">Updated <span class="sort-ind">↕</span></th>
                  <th>Status</th>
                  <th style="text-align: right">Actions</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
          <div class="pagination">
            <span class="info" id="page-info"></span>
            <button class="page-btn" onclick="page.prev()">‹</button>
            <span id="page-btns" style="display: contents"></span>
            <button class="page-btn" onclick="page.next()">›</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="./admin-sidebar.js"></script>
  <script src="./admin-demo.js"></script>
  <script>
    'use strict';

    /* ===== Demo data ====================================================== */
    const TYPES = { string: 'String', number: 'Number', boolean: 'Boolean', json: 'JSON', color: 'Color' };
    const DATA = [
      { id: 1,  key: 'site.name',            type: 'string',  value: 'Koklass Kitchen',      desc: 'Public site name',             updated: '2026-11-17', active: true },
      { id: 2,  key: 'site.tagline',         type: 'string',  value: 'Finger clickin\' good', desc: 'Marketing tagline',            updated: '2026-11-16', active: true },
      { id: 3,  key: 'orders.max_per_day',   type: 'number',  value: '500',                  desc: 'Daily order cap',              updated: '2026-11-15', active: true },
      { id: 4,  key: 'orders.auto_accept',   type: 'boolean', value: 'true',                 desc: 'Auto-accept incoming orders',  updated: '2026-11-14', active: false },
      { id: 5,  key: 'delivery.radius_km',   type: 'number',  value: '12',                   desc: 'Delivery radius',              updated: '2026-11-12', active: true },
      { id: 6,  key: 'theme.primary_color',  type: 'color',   value: '#EC3876',              desc: 'Brand primary',                updated: '2026-11-11', active: true },
      { id: 7,  key: 'payments.gateway',     type: 'string',  value: 'eSewa',                desc: 'Active payment gateway',       updated: '2026-11-10', active: true },
      { id: 8,  key: 'payments.extra',       type: 'json',    value: '{"fee": 2.5}',         desc: 'Gateway extras',               updated: '2026-11-09', active: false },
      { id: 9,  key: 'email.from_name',      type: 'string',  value: 'Koklass Support',      desc: 'Email sender name',            updated: '2026-11-08', active: true },
      { id: 10, key: 'email.smtp.host',      type: 'string',  value: 'smtp.koklass.io',      desc: 'SMTP host',                    updated: '2026-11-07', active: true },
      { id: 11, key: 'email.smtp.port',      type: 'number',  value: '587',                  desc: 'SMTP port',                    updated: '2026-11-06', active: false },
      { id: 12, key: 'catalog.out_of_stock', type: 'boolean', value: 'false',                desc: 'Hide sold-out items',          updated: '2026-11-05', active: true },
      { id: 13, key: 'users.max_login_try',  type: 'number',  value: '5',                    desc: 'Lockout after N failed logins', updated: '2026-11-04', active: true },
      { id: 14, key: 'feature.new_charts',   type: 'boolean', value: 'true',                 desc: 'Beta analytics module',        updated: '2026-11-03', active: true },
    ];
    const PER_PAGE = 8;

    const page = {
      q: '', type: '', status: '', sort: 'key', dir: 1, page: 1, sel: new Set(),

      go() {
        this.q = document.getElementById('fq').value.trim().toLowerCase();
        this.page = 1;
        this.render();
      },
      setType(v) { this.type = v === '__ALL__' ? '' : v; this.page = 1; this.render(); },
      setStatus(v) { this.status = v === '__ALL__' ? '' : v; this.page = 1; this.render(); },
      sortBy(k) {
        if (this.sort === k) this.dir *= -1; else { this.sort = k; this.dir = 1; }
        document.querySelectorAll('th.sortable').forEach(th => {
          th.classList.toggle('sorted', th.dataset.sort === this.sort);
          th.querySelector('.sort-ind').textContent = th.dataset.sort === this.sort ? (this.dir > 0 ? '↑' : '↓') : '↕';
        });
        this.render();
      },
      rows() {
        let r = DATA.filter(x =>
          (!this.q || (x.key + ' ' + x.desc).toLowerCase().includes(this.q))
          && (!this.type || x.type === this.type)
          && (!this.status || (this.status === 'Enabled') === x.active));
        const key = this.sort;
        r = r.slice().sort((a, b) => {
          const va = a[key], vb = b[key];
          if (typeof va === 'number' || typeof vb === 'number') return (va - vb) * this.dir;
          return String(va).localeCompare(String(vb)) * this.dir;
        });
        return r;
      },
      render() {
        const all = this.rows();
        const pages = Math.max(1, Math.ceil(all.length / PER_PAGE));
        if (this.page > pages) this.page = pages;
        const slice = all.slice((this.page - 1) * PER_PAGE, this.page * PER_PAGE);
        document.getElementById('meta').textContent = all.length + ' of ' + DATA.length + ' configs';
        document.getElementById('rows').innerHTML = slice.map(x => this.row(x)).join('') ||
          '<tr><td colspan="8" style="text-align:center;color:var(--muted-foreground);padding:28px">No configs match your filters.</td></tr>';

        document.getElementById('page-info').textContent = 'Showing ' + (slice.length ? (this.page - 1) * PER_PAGE + 1 : 0) + '–' + ((this.page - 1) * PER_PAGE + slice.length) + ' of ' + all.length;
        let btns = '';
        for (let i = 1; i <= pages; i++) btns += '<button class="page-btn' + (i === this.page ? ' current' : '') + '" onclick="page.to(' + i + ')">' + i + '</button>';
        document.getElementById('page-btns').innerHTML = btns;
        document.querySelector('.page-btn').disabled = this.page === 1;
        document.querySelectorAll('#rows .cb[type=checkbox]').forEach(cb => cb.checked = this.sel.has(Number(cb.dataset.id)));
        this.syncBulk();
      },
      row(x) {
        const cls = { string: 'badge-info', number: 'badge-warning', boolean: 'badge-brand', json: 'badge-muted', color: 'badge-success' }[x.type];
        const val = x.type === 'color' ? '<span style="display:inline-flex;align-items:center;gap:6px"><i style="width:12px;height:12px;border-radius:3px;background:' + x.value + '"></i>' + x.value + '</span>' : x.value;
        return '<tr data-id="' + x.id + '">'
          + '<td><input type="checkbox" class="cb" data-id="' + x.id + '" onchange="page.pick(this)"' + (this.sel.has(x.id) ? ' checked' : '') + '/></td>'
          + '<td><a href="./config-edit.html" style="color:var(--ring);font-weight:700"><code style="background:var(--secondary);padding:2px 7px;border-radius:6px;font-size:.8rem">' + x.key + '</code></a></td>'
          + '<td><span class="badge ' + cls + '">' + TYPES[x.type] + '</span></td>'
          + '<td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + val + '</td>'
          + '<td style="color:var(--muted-foreground)">' + x.desc + '</td>'
          + '<td class="cell-num">' + x.updated + '</td>'
          + '<td><span class="badge ' + (x.active ? 'badge-success' : 'badge-muted') + '"><span class="dot"></span>' + (x.active ? 'Active' : 'Disabled') + '</span></td>'
          + '<td><div class="cell-actions">'
          + '<a class="icon-act edit" title="Edit" href="./config-edit.html"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></a>'
          + '<button class="icon-act del" title="Delete" onclick="page.del(' + x.id + ')"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m-9 0v14h10V6"/></svg></button>'
          + '</div></td></tr>';
      },
      toggleAll(on) { const s = this.rows().slice((this.page - 1) * PER_PAGE, this.page * PER_PAGE); s.forEach(x => on ? this.sel.add(x.id) : this.sel.delete(x.id)); this.render(); },
      pick(cb) { const id = Number(cb.dataset.id); cb.checked ? this.sel.add(id) : this.sel.delete(id); this.syncBulk(); },
      clearSel() { this.sel.clear(); this.render(); },
      syncBulk() {
        const bar = document.getElementById('bulkbar');
        bar.classList.toggle('show', this.sel.size > 0);
        document.getElementById('bulk-count').textContent = this.sel.size;
        const all = document.getElementById('sel-all');
        if (all) all.checked = this.sel.size > 0 && this.sel.size === PER_PAGE;
      },
      bulkEnable() { DATA.forEach(x => { if (this.sel.has(x.id)) x.active = true; }); this.sel.clear(); this.render(); showToast('Selected configs enabled'); },
      bulkDisable() { DATA.forEach(x => { if (this.sel.has(x.id)) x.active = false; }); this.sel.clear(); this.render(); showToast('Selected configs disabled'); },
      bulkDelete() {
        window.openModal({
          title: 'Delete configs?', body: 'You are about to permanently delete <b>' + this.sel.size + ' config(s)</b>. This action cannot be undone.',
          okText: 'Delete', ok: () => {
            for (let i = DATA.length - 1; i >= 0; i--) if (this.sel.has(DATA[i].id)) DATA.splice(i, 1);
            this.sel.clear(); this.render(); showToast('Configs deleted');
          },
        });
      },
      del(id) {
        const x = DATA.find(d => d.id === id);
        window.openModal({
          title: 'Delete config?', body: 'Permanently delete <b>' + x.key + '</b>? This cannot be undone.',
          okText: 'Delete', ok: () => { DATA.splice(DATA.indexOf(x), 1); this.render(); showToast('Config deleted'); },
        });
      },
      prev() { if (this.page > 1) { this.page--; this.render(); } },
      next() { const p = Math.ceil(this.rows().length / PER_PAGE); if (this.page < p) { this.page++; this.render(); } },
      to(p) { this.page = p; this.render(); },
    };
    window.page = page;

    /* Custom dropdown filters (theme-styled menus) */
    window.bindDropdown(document.getElementById('f-type'),
      [{ v: '__ALL__', t: 'All types' }].concat(Object.keys(TYPES).map(v => ({ v, t: TYPES[v] }))),
      v => page.setType(v));
    window.bindDropdown(document.getElementById('f-status'),
      [{ v: '__ALL__', t: 'All status' }, { v: 'Enabled', t: 'Enabled' }, { v: 'Disabled', t: 'Disabled' }],
      v => page.setStatus(v));

    document.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => page.sortBy(th.dataset.sort)));
    page.render();
  </script>
</body>
</html>
